name: Desktop CI
on:
  push:
    branches: [main, 'feature/**', 'integration/**', 'develop/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-gate:
    name: Check desktop source
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        shell: bash
        run: |
          if [[ -f package.json && -f package-lock.json && -f src/frontend/App.svelte && -f src/electron/index.ts ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Desktop source not yet imported; package builds intentionally gated.' >> "$GITHUB_STEP_SUMMARY"
          fi
  svelte-regression:
    name: Compare with untouched FreeShow Svelte baseline
    needs: source-gate
    if: needs.source-gate.outputs.ready == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/checkout@v4
        with:
          ref: integration/freeshow-v1.6.6
          path: upstream
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install prerequisites
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libx11-dev libxkbfile-dev libegl1 libgles2 libegl-dev
      - name: Install and typecheck unchanged upstream
        shell: bash
        run: |
          cd upstream
          npm ci
          npm run test:svelte > ../baseline.log 2>&1 || true
          tail -n 2 ../baseline.log
      - name: Install and typecheck candidate
        shell: bash
        run: |
          cd candidate
          npm ci
          npm run test:svelte > ../candidate.log 2>&1 || true
          tail -n 2 ../candidate.log
      - name: Reject novel diagnostics
        run: node candidate/scripts/ci/compare-svelte-baseline.mjs baseline.log candidate.log | tee svelte-diff.json
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fullstage-svelte-baseline-${{ github.run_number }}
          path: |
            baseline.log
            candidate.log
            svelte-diff.json
          if-no-files-found: ignore
          retention-days: 30
  desktop:
    needs: [source-gate, svelte-regression]
    if: needs.source-gate.outputs.ready == 'true' && needs.svelte-regression.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: windows
          - os: macos-latest
            label: macos
          - os: ubuntu-22.04
            label: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Linux native prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libx11-dev libxkbfile-dev libegl1 libgles2 libegl-dev libgles-dev
      - name: Install
        run: npm ci
      - name: Unit tests
        run: npm run test:unit --if-present
      - name: Svelte check (diagnostic; does not block independent build)
        id: svelte
        continue-on-error: true
        run: npm run test:svelte --if-present
      - name: Compile FullStage-enabled desktop application
        id: compile
        continue-on-error: true
        env:
          VITE_FULLSTAGE_UI: "true"
        run: npm run build
      - name: Verify compilation and Svelte validation
        shell: bash
        env:
          SVELTE: ${{ steps.svelte.outcome }}
          COMPILE: ${{ steps.compile.outcome }}
        run: |
          echo "Svelte: $SVELTE; Build: $COMPILE"
          echo "Typechecking remains a release-blocking gate; packaging is diagnostic only."
          test "$COMPILE" = success
      - name: Package FullStage-enabled unpacked application (diagnostic)
        id: packaging
        continue-on-error: true
        run: npm run pack
      - name: FullStage operator smoke test (Linux, test-instrumented build)
        if: runner.os == 'Linux'
        id: smoke
        continue-on-error: true
        shell: bash
        run: |
          sudo apt-get install -y xvfb
          VITE_FULLSTAGE_UI=true VITE_FULLSTAGE_TEST=true npm run build
          xvfb-run -a npx playwright test --config config/testing/playwright.config.ts config/testing/fullstage.smoke.test.ts
      - name: Upload operator smoke diagnostics
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v4
        with:
          name: fullstage-operator-smoke-${{ github.run_number }}
          path: |
            test-output/playwright-report/**
            test-results/**
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload unpacked application
        uses: actions/upload-artifact@v4
        with:
          name: fullstage-ui-enabled-${{ matrix.label }}-unpacked-${{ github.run_number }}
          path: |
            dist/**
            release/**
          if-no-files-found: error
          retention-days: 14

      - name: Fail release qualification on typecheck or packaging
        shell: bash
        env:
          SVELTE: ${{ steps.svelte.outcome }}
          PACKAGING: ${{ steps.packaging.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
        run: |
          echo "Typecheck=$SVELTE packaging=$PACKAGING" >> "$GITHUB_STEP_SUMMARY"
          echo "Svelte errors are checked against FreeShow by the mandatory svelte-regression job."
          test "$PACKAGING" = success
          if [[ "$RUNNER_OS" == "Linux" ]]; then test "$SMOKE" = success; fi
