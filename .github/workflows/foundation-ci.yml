name: Foundation checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check foundation files
        shell: bash
        run: |
          test -s README.md
          test -s CONTRIBUTING.md
          test -s SECURITY.md
          test -s docs/ROADMAP.md
          test -s docs/ARCHITECTURE.md
          echo "FullStage repository foundation validated"
