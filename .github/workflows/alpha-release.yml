name: Alpha release (manual)
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Prerelease version (e.g. 0.6.0-alpha.1)'
        required: true
        type: string
permissions:
  contents: write
jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate version and source prerequisites
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]] || { echo 'Use semver alpha version'; exit 1; }
          for f in package.json package-lock.json src/frontend/App.svelte src/electron/index.ts; do
            test -s "$f" || { echo "Missing desktop source: $f"; exit 1; }
          done
          test -f LICENSE || { echo 'Missing final license file'; exit 1; }
          echo 'Source prerequisites passed; release requires platform builds.' >> "$GITHUB_STEP_SUMMARY"
  build:
    needs: release-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos
          - os: ubuntu-latest
            label: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libx11-dev libxkbfile-dev
      - run: npm ci
      - run: npm run test:unit --if-present
      - run: npm run test:svelte --if-present
      - run: npm run build
      - name: Package desktop
        run: npx electron-builder --config config/building/electron-builder.yaml --publish never
      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: alpha-${{ matrix.label }}
          path: |
            dist/**
            release/**
          if-no-files-found: error
          retention-days: 30
  draft:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: alpha-*
          path: staged-assets
          merge-multiple: true
      - name: Validate release asset existence
        shell: bash
        run: test -n "$(find staged-assets -type f -print -quit)"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: FullStage v${{ inputs.version }}
          prerelease: true
          draft: true
          generate_release_notes: true
          files: staged-assets/**/*
          fail_on_unmatched_files: true
          body: |
            Development alpha. Unsigned installers may display OS warnings.
            Do not use in production services until display and media regression tests pass.
